# Findings this repository accepts, with the reasoning that earned the exception.

rules:
  # zizmor asks for at least seven days before Dependabot proposes a release, as protection against
  # consuming a freshly compromised version before it is yanked. This repository takes updates
  # immediately instead: every bump is reviewed by a human, lockfiles and checksums are pinned, and
  # the full pipeline runs before anything merges, so a bad release is caught by the gate rather
  # than by waiting. The cost of the delay on security patches is judged higher than the residual
  # risk. The pipeline does run a bumped action before that review: the inventory sync refuses to
  # mint its App token when a bump moves its own actions, but the CI run on the same pull request
  # still hands SONAR_TOKEN and the CI gate App key to bumped ci.yml actions (DEPENDENCY-POLICY.md,
  # Inventory sync). Reviewed 2026-11-02.
  dependabot-cooldown:
    ignore:
      - dependabot.yml

  # zizmor wants every secret carried by a GitHub Environment so its protection rules gate access.
  # Six references are covered here: SONAR_TOKEN in the pull request analysis and in the main
  # baseline, the two create-github-app-token inputs of the trusted gate, and the two of the
  # Dependabot inventory sync. The last four cannot move to an env block at all, since they are
  # action inputs.
  #
  # An Environment only protects through its rules, and neither shape works on this path. Without
  # rules it is indirection that silences the audit and guards nothing. With a required reviewer it
  # would hold every pull request until the sole maintainer approves their own change. A branch
  # restriction cannot apply either, because the gate runs on pull_request events and never on main.
  # The inventory sync has the same shape: it runs on Dependabot branches, its secrets are
  # Dependabot secrets that only Dependabot-triggered runs receive, and the job also requires a
  # Dependabot-authored pull request from this repository whose copy of the workflow matches the
  # base branch.
  #
  # What genuinely matters is already covered: the release path sits behind the hub-release
  # environment with a required reviewer, forks never receive secrets, and CI additionally checks
  # that the head repository is this one.
  #
  # REVISIT when a second maintainer gains write access. The residual threat is a compromised
  # collaborator account, and an Environment stops being self-approval once the approver and the
  # approved are different people. Reviewed 2026-08-14.
  secrets-outside-env:
    ignore:
      - ci.yml
      - dependabot-inventory.yml
      - sonar-main.yml
