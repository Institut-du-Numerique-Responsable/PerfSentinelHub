apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
data:
  appsettings.Production.json: |-
    {{- $sources := list }}
    {{- range .Values.sources }}
    {{- $source := dict "Id" .id "Name" .name "Environment" .environment "Kind" (default "daemon" .kind) "RetentionHours" .retentionHours "BaseUrl" .baseUrl "PublicUrl" .publicUrl "AuthHeaderName" .authHeaderName "PublicAuthHeaderName" .publicAuthHeaderName "AckHeaderName" .ackHeaderName }}
    {{- /* The secret of an authenticated Prometheus is not here: it reaches the pod
           as an environment variable, like the source's own credentials. */}}
    {{- range $key, $stats := dict "PgStat" .pgStat "MySqlStat" .mysqlStat }}
    {{- with $stats }}
    {{- $_ := set $source $key (dict "Prometheus" .prometheus "Metric" .metric "QueryLabel" .queryLabel "CallsMetric" .callsMetric "Unit" .unit "Selector" .selector "Top" .top "AuthHeaderName" .authHeaderName) }}
    {{- end }}
    {{- end }}
    {{- $sources = append $sources $source }}
    {{- end }}
    {{- $analysis := dict "EngineBinaryPath" .Values.hub.analysis.engineBinaryPath "ReportDirectory" "/data/reports" "IdentityHeader" .Values.hub.analysis.identityHeader "Workers" .Values.hub.analysis.workers "MaxTracesCap" .Values.hub.analysis.maxTracesCap "Timeout" .Values.hub.analysis.timeout "MinFreeMemoryMiB" .Values.hub.analysis.minFreeMemoryMiB "ReportRetention" .Values.hub.analysis.reportRetention "RunRetention" .Values.hub.analysis.runRetention }}
    {{- /* Nil-safe and false-safe. An upgrade with --reuse-values carries values
           that predate this key, so a bare lookup is a nil pointer; and `default
           true` would read an explicit false as absent and turn the check back
           on. hasKey is the only form that tells the two apart. */}}
    {{- $update := .Values.hub.updateCheck | default dict }}
    {{- $enabled := true }}
    {{- if hasKey $update "enabled" }}{{- $enabled = $update.enabled }}{{- end }}
    {{- $updateCheck := dict "Enabled" $enabled }}
    {{- /* Nil-safe for --reuse-values, like updateCheck above. The secret is
           not here: it reaches the pod as an environment variable. */}}
    {{- $authValues := .Values.hub.auth | default dict }}
    {{- $auth := dict "Enabled" false }}
    {{- if $authValues.enabled }}
    {{- $auth = dict "Enabled" true "AuthorizationEndpoint" $authValues.authorizationEndpoint "TokenEndpoint" $authValues.tokenEndpoint "UserInformationEndpoint" $authValues.userInformationEndpoint "ClientId" $authValues.clientId "Scopes" (default "openid profile email" $authValues.scopes) "IdentityClaim" (default "email" $authValues.identityClaim) "SubjectClaim" (default "sub" $authValues.subjectClaim) "GroupsClaim" (default "groups" $authValues.groupsClaim) "RequiredGroups" (default (list) $authValues.requiredGroups) "TrustedProxyNetworks" (default (list) $authValues.trustedProxyNetworks) }}
    {{- end }}
    {{- /* Nil-safe for --reuse-values, like updateCheck above. The ack
           credential is not here either: only its header name is, in a source. */}}
    {{- $ackRelayValues := .Values.hub.ackRelay | default dict }}
    {{- $ackRelay := dict "TrustIdentityHeader" (default false $ackRelayValues.trustIdentityHeader) }}
    {{- /* Nil-safe for --reuse-values, like updateCheck above, and passed as is:
           keys bind case-insensitively, and secretName and secretKey name a
           Secret, hold none, and are ignored by the binder. */}}
    {{- $access := .Values.hub.access | default dict }}
    {{- $hub := dict "DatabasePath" "/data/hub.db" "Analysis" $analysis "UpdateCheck" $updateCheck "Auth" $auth "AckRelay" $ackRelay "Access" $access "PollInterval" .Values.hub.pollInterval "HttpTimeout" .Values.hub.httpTimeout "MaxConcurrentPolls" .Values.hub.maxConcurrentPolls "Retention" .Values.hub.retention "DetectionRetention" (default "1100.00:00:00" .Values.hub.detectionRetention) "ResolutionGrace" .Values.hub.resolutionGrace "DefaultReadLimit" .Values.hub.defaultReadLimit "MaxReadLimit" .Values.hub.maxReadLimit "NewSignaturesPerHourWarning" .Values.hub.newSignaturesPerHourWarning "Sources" $sources }}
    {{- if .Values.hub.metricsPort }}{{- $_ := set $hub "MetricsPort" .Values.hub.metricsPort }}{{- end }}
    {{- /* Nil-safe for --reuse-values. The import key, the webhook URLs and their
           secrets reach the pod as environment variables, never here. */}}
    {{- $disclosures := .Values.hub.disclosures | default dict }}
    {{- if $disclosures.importSecretName }}
    {{- $webhooks := list }}
    {{- range $disclosures.webhooks | default list }}
    {{- $webhooks = append $webhooks (dict "Name" .name "IncludeShareLink" (default false .includeShareLink) "ShareLinkDays" (default 7 .shareLinkDays)) }}
    {{- end }}
    {{- $section := dict "AllowInternal" (default false $disclosures.allowInternal) "ShareLinkDays" (default 7 $disclosures.shareLinkDays) "Webhooks" $webhooks }}
    {{- if $disclosures.expectedIdentity }}{{- $_ := set $section "ExpectedIdentity" $disclosures.expectedIdentity }}{{- end }}
    {{- if $disclosures.expectedIssuer }}{{- $_ := set $section "ExpectedIssuer" $disclosures.expectedIssuer }}{{- end }}
    {{- if $disclosures.publicUrl }}{{- $_ := set $section "PublicUrl" $disclosures.publicUrl }}{{- end }}
    {{- $_ := set $hub "Disclosures" $section }}
    {{- end }}
    {{- /* Nil-safe for --reuse-values: a release that predates hub.recaps keeps the
           Hub's defaults. The webhook URLs and secrets and the SMTP password reach
           the pod as environment variables, never here. Subscriptions are passed as
           is: their keys bind case-insensitively and none holds a secret. */}}
    {{- $recaps := .Values.hub.recaps | default dict }}
    {{- if $recaps }}
    {{- $recapWebhooks := list }}
    {{- range $recaps.webhooks | default list }}
    {{- $recapWebhooks = append $recapWebhooks (dict "Name" .name) }}
    {{- end }}
    {{- $recapSection := dict "MovementThreshold" (default 0.2 $recaps.movementThreshold) "Retention" (default "365.00:00:00" $recaps.retention) "MaxDelay" (default "06:00:00" $recaps.maxDelay) "Webhooks" $recapWebhooks "Subscriptions" ($recaps.subscriptions | default list) }}
    {{- if $recaps.publicUrl }}{{- $_ := set $recapSection "PublicUrl" $recaps.publicUrl }}{{- end }}
    {{- $smtpValues := $recaps.smtp | default dict }}
    {{- if $smtpValues.host }}
    {{- /* hasKey, as for updateCheck: default true would read an explicit false as absent. */}}
    {{- $startTls := true }}
    {{- if hasKey $smtpValues "startTls" }}{{- $startTls = $smtpValues.startTls }}{{- end }}
    {{- $smtp := dict "Host" $smtpValues.host "Port" (default 587 $smtpValues.port) "StartTls" $startTls "From" $smtpValues.from }}
    {{- if $smtpValues.userName }}{{- $_ := set $smtp "UserName" $smtpValues.userName }}{{- end }}
    {{- $_ := set $recapSection "Smtp" $smtp }}
    {{- end }}
    {{- $_ := set $hub "Recaps" $recapSection }}
    {{- end }}
    {{ dict "Hub" $hub | toJson }}
