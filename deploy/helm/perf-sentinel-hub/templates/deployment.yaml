{{- $ids := dict }}
{{- range .Values.sources }}
{{- if hasKey $ids .id }}{{ fail (printf "duplicate source id: %s" .id) }}{{ end }}
{{- $_ := set $ids .id true }}
{{- end }}
{{- /* Nil-safe for --reuse-values from a release that predates hub.access. Each
       token's and local account's Secret reference is checked whatever the switch;
       the env var that delivers the token or the hash is added only with access on. */}}
{{- $access := .Values.hub.access | default dict }}
{{- $tokenNames := dict }}
{{- range ($access.machineTokens | default list) }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9._-]{0,63}$" (toString .name)) }}{{ fail (printf "machine token name must match ^[a-z0-9][a-z0-9._-]{0,63}$: %v" .name) }}{{ end }}
{{- if hasKey $tokenNames .name }}{{ fail (printf "duplicate machine token name: %s" .name) }}{{ end }}
{{- $_ := set $tokenNames .name true }}
{{- if not (and .secretName .secretKey) }}{{ fail (printf "machine token %s needs secretName and secretKey" .name) }}{{ end }}
{{- end }}
{{- $accountNames := dict }}
{{- range ($access.localAccounts | default list) }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9._-]{0,63}$" (toString .name)) }}{{ fail (printf "local account name must match ^[a-z0-9][a-z0-9._-]{0,63}$: %v" .name) }}{{ end }}
{{- if hasKey $accountNames .name }}{{ fail (printf "duplicate local account name: %s" .name) }}{{ end }}
{{- $_ := set $accountNames .name true }}
{{- if not (and .secretName .secretKey) }}{{ fail (printf "local account %s needs secretName and secretKey" .name) }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perf-sentinel-hub.name" . }}
spec:
  # Not a knob: SQLite has a single writer and the PVC is ReadWriteOnce.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "perf-sentinel-hub.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The config is mounted with subPath, which Kubernetes never refreshes in place:
        # this checksum rolls the pod whenever the ConfigMap content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "perf-sentinel-hub.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub
          image: {{ include "perf-sentinel-hub.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080 }
            {{- with .Values.hub.metricsPort }}
            - { name: metrics, containerPort: {{ . }} }
            {{- end }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            {{- with .Values.hub.metricsPort }}
            # Hub:MetricsPort does not make Kestrel listen: the Hub stops at startup unless it does.
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080;{{ . }}"
            {{- end }}
            {{- with .Values.hub.auth }}
            {{- if .enabled }}
            - name: Hub__Auth__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .clientSecretName }}
                  key: {{ .clientSecretKey }}
            {{- end }}
            {{- end }}
            {{- if $access.enabled }}
            {{- range $index, $token := $access.machineTokens | default list }}
            - name: Hub__Access__MachineTokens__{{ $index }}__Token
              valueFrom:
                secretKeyRef:
                  name: {{ $token.secretName }}
                  key: {{ $token.secretKey }}
            {{- end }}
            {{- range $index, $account := $access.localAccounts | default list }}
            - name: Hub__Access__LocalAccounts__{{ $index }}__PasswordHash
              valueFrom:
                secretKeyRef:
                  name: {{ $account.secretName }}
                  key: {{ $account.secretKey }}
            {{- end }}
            {{- end }}
            {{- range $index, $source := .Values.sources }}
            {{- if $source.authSecretName }}
            - name: Hub__Sources__{{ $index }}__AuthHeaderValue
              valueFrom:
                secretKeyRef:
                  name: {{ $source.authSecretName }}
                  key: {{ $source.authSecretKey }}
            {{- end }}
            {{- if $source.ackSecretName }}
            - name: Hub__Sources__{{ $index }}__AckHeaderValue
              valueFrom:
                secretKeyRef:
                  name: {{ $source.ackSecretName }}
                  key: {{ $source.ackSecretKey }}
            {{- end }}
            {{- if $source.importSecretName }}
            - name: Hub__Sources__{{ $index }}__ImportApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ $source.importSecretName }}
                  key: {{ $source.importSecretKey }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /app/appsettings.Production.json, subPath: appsettings.Production.json }
          {{- with .Values.probes }}
          startupProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: {{ .startup.periodSeconds }}, failureThreshold: {{ .startup.failureThreshold }} }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: {{ .readiness.periodSeconds }}, timeoutSeconds: {{ .readiness.timeoutSeconds }}, failureThreshold: {{ .readiness.failureThreshold }} }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: {{ .liveness.periodSeconds }}, timeoutSeconds: {{ .liveness.timeoutSeconds }}, failureThreshold: {{ .liveness.failureThreshold }} }
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ include "perf-sentinel-hub.name" . }} }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: config
          configMap: { name: {{ include "perf-sentinel-hub.name" . }} }
