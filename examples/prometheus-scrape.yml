# Scraping PerfSentinelHub.
#
# On Kubernetes the chart already carries the annotations a Prometheus with
# annotation discovery reads, so this file is for a deployment that names its
# targets: docker compose, a VM, or a Prometheus without discovery. See
# docs/OPERATIONS.md for the annotation form.
#
# /metrics carries no authentication. The target below is Hub:MetricsPort, the
# port /metrics answers on alone (required with access control on); a Hub without
# it serves /metrics on its main port, 8080. See docs/OPERATIONS.md.

global:
  scrape_interval: 30s

rule_files:
  - prometheus-alerts.yml

scrape_configs:
  - job_name: perf-sentinel-hub
    metrics_path: /metrics
    # The example dashboard reads one Hub, the one its Job variable selects.
    # A second Hub scraped by the same Prometheus takes its own job_name, and
    # HubDown in prometheus-alerts.yml, which matches this job only, its own rule.
    static_configs:
      - targets:
          - perf-sentinel-hub.observability:9464

  # The daemons the Hub collects from publish their own, unrelated metrics:
  # findings, GreenOps figures, ingest rates. Nothing in this dashboard reads
  # them, and nothing in the engine's dashboard reads the Hub's.
  - job_name: perf-sentinel
    metrics_path: /metrics
    static_configs:
      - targets:
          - perf-sentinel.observability:4318
